<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1E3A8A">
    <title>Hors ligne — Concours-Pro</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0F172A; color: #E2E8F0; text-align: center; }
        img { width: 72px; height: 72px; }
        h1 { font-size: 20px; margin: 20px 0 8px; color: #fff; }
        p { margin: 0 0 24px; color: #94A3B8; max-width: 320px; }
        button { background: #2563EB; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Pas de connexion Internet</h1>
        <p>Concours-Pro a besoin d'Internet pour afficher vos dossiers. Vérifiez votre connexion puis réessayez.</p>
        <button onclick="location.reload()">Réessayer</button>
    </main>
</body>
</html>
